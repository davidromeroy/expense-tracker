# Watchdog de hardware — /etc/systemd/system.conf.d/10-watchdog.conf
#
# systemd "acaricia" el watchdog del chip (bcm2835_wdt) cada pocos segundos.
# Si el kernel o systemd se cuelgan y dejan de hacerlo, el chip reinicia la
# Pi solo, sin que nadie tenga que desenchufarla. No cubre la red ni el
# servicio (para eso están net-watchdog y expense-tracker-repair): cubre el
# cuelgue total, el caso en que nada de software puede reaccionar.
#
# 14 s y no más: el watchdog del BCM2835 no acepta plazos de más de ~15 s.
[Manager]
RuntimeWatchdogSec=14
# Si un reboot se traba a mitad de camino, forzarlo a los 2 minutos.
RebootWatchdogSec=2min
